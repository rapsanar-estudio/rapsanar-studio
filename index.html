 l.unshift({id:String(Date.now()),at:new Date().toISOString(),target,reason,status:"PREPARED",
 steps:[
  {name:"Preservar evidencia y logs",done:true},
  {name:"Capturar estado recuperable",done:true},
  {name:"Aislar componente afectado",done:false},
  {name:"Reiniciar sólo el componente",done:false},
  {name:"Verificar integridad",done:false},
  {name:"Probar con privilegios mínimos",done:false},
  {name:"Restaurar gradualmente",done:false}
 ]});
 localStorage.setItem("rapsanar_safe_reset_log",JSON.stringify(l.slice(0,100)));renderSafeRecovery();
}
function advanceSafeReset(id){
 const l=getSafeResetLog().map(x=>{
  if(x.id!==id)return x;
  const steps=x.steps.map(s=>({...s}));
  const next=steps.find(s=>!s.done); if(next)next.done=true;
  const complete=steps.every(s=>s.done);
  return {...x,steps,status:complete?"RECOVERED":"IN PROGRESS",updatedAt:new Date().toISOString()};
 });
 localStorage.setItem("rapsanar_safe_reset_log",JSON.stringify(l));renderSafeRecovery();
}

function guardianRestoreReadiness(){
 const resets=getSafeResetLog();
 return resets.map(x=>{
   const completed=x.steps.filter(s=>s.done).length,total=x.steps.length;

   const ready=x.status==="RECOVERED"&&integrity&&minimum;
   return {...x,completed,total,integrity,minimum,ready,
     verdict:ready?"READY TO RESTORE":"NOT READY"};
 });
}

function guardianRecurrenceWatch(){
 const incidents=guardianIncidentReview(),prevent=guardianPreventiveActions(),now=Date.now(),days=30*86400000;
 return prevent.map(p=>{
  const recent=incidents.filter(i=>i.type===p.type && now-new Date(i.at).getTime()<=days).length;
  const previous=incidents.filter(i=>i.type===p.type && now-new Date(i.at).getTime()>days).length;
  const trend=recent===0?"SIN RECURRENCIA":recent<previous?"BAJANDO":recent===previous?"ESTABLE":"SUBIENDO";
  return {...p,recent,previous,trend,signal:recent>=3?"ESCALAR":recent?"VIGILAR":"CONTROLADO"};
 });
}

function guardianPreventiveActions(){
 const incidents=guardianIncidentReview();
 const grouped={};
 incidents.forEach(x=>{
  const key=x.type;
  if(!grouped[key])grouped[key]={type:key,count:0,subjects:new Set(),lesson:x.lesson};
  grouped[key].count++; grouped[key].subjects.add(x.subject);
 });
 return Object.values(grouped).map(x=>({
  type:x.type,count:x.count,subjects:[...x.subjects],
  priority:x.count>=3?"ALTA":x.count>=2?"MEDIA":"OBSERVAR",
  action:x.type==="ROLE RECOVERY"?"Reemitir credenciales comprometidas y revisar custodia.":
         x.type==="BREAK-GLASS"?"Revisar causa raíz y reducir necesidad de excepciones.":
         "Reforzar requisitos previos y claridad del flujo de autorización."
 }));
}

 recoveries.forEach(r=>incidents.push({type:"ROLE RECOVERY",at:r.at,subject:r.role,status:r.status,lesson:"Revisar pérdida, custodia y reemisión de credencial."}));
 emergency.forEach(e=>incidents.push({type:"BREAK-GLASS",at:e.at,subject:e.scope,status:e.status,lesson:"Verificar si la excepción fue necesaria y si el alcance fue mínimo."}));

function guardianCorrectionPatterns(){
 const rows=correctionEffectiveness(),groups={};
 rows.forEach(x=>{
   const key=x.source||"OTRA CORRECCIÓN";
   if(!groups[key])groups[key]={source:key,total:0,improved:0,uncertain:0,nochange:0,pending:0,deltas:[]};
   const g=groups[key];g.total++;
   if(x.verdict==="MEJORÓ")g.improved++;
   else if(x.verdict==="REVELÓ MÁS INCERTIDUMBRE")g.uncertain++;
   else if(x.verdict==="SIN CAMBIO")g.nochange++;
   else g.pending++;
   if(x.delta!==null)g.deltas.push(x.delta);
 });
 return Object.values(groups).map(g=>{
   const measured=g.deltas.length;
   const avg=measured?Math.round(g.deltas.reduce((a,b)=>a+b,0)/measured*10)/10:null;
   const success=measured?Math.round(g.improved*100/measured):null;
   let signal="SIN DATOS";
   if(measured>=2 && success>=60)signal="CORRECCIÓN PROMETEDORA";
   else if(measured>=2 && g.nochange>=Math.ceil(measured/2))signal="REVISAR ESTRATEGIA";
   else if(measured>=2 && g.uncertain>=Math.ceil(measured/2))signal="DESCUBRE INCERTIDUMBRE";
   else if(measured)signal="EVIDENCIA TEMPRANA";
   return {...g,measured,avg,success,signal};
 }).sort((a,b)=>(b.measured-a.measured)||(b.total-a.total));
}

function correctionEffectiveness(){
 const l=getCorrectionLedger(),h=getEvidenceMissionHistory().slice().sort((a,b)=>new Date(a.at)-new Date(b.at));
 return l.map(c=>{
   const after=h.find(x=>new Date(x.at)>new Date(c.at));
   const delta=after?after.coverage-c.coverage:null;
   const verdict=delta===null?"PENDIENTE":delta>0?"MEJORÓ":delta<0?"REVELÓ MÁS INCERTIDUMBRE":"SIN CAMBIO";
   return {...c,afterCoverage:after?.coverage??null,delta,verdict};
 });
}

function guardianResearchPriority(){
 const gaps=guardianEvidenceGaps(),tasks=getEvidenceTasks(),impact=guardianEvidenceROI();
 return gaps.map(g=>{
   const prior=tasks.find(t=>t.title===g.title);
   const friction=prior?.status==="EN CURSO"?8:prior?.status==="COMPLETADA"?15:4;
   const learningBonus=impact.gain<=0?8:3;
   const priority=Math.max(0,Math.round(g.weight*2+learningBonus-friction));
   return {...g,priority,friction,status:prior?.status||"PENDIENTE"};
 }).sort((a,b)=>b.priority-a.priority);
}

function guardianEvidenceGaps(){

 if(!d.topPlay)gaps.push({weight:30,title:"SIN PLAYBOOK COMPARABLE",detail:"No existe una ruta histórica suficientemente comparable.",action:"Registrar y verificar más respuestas."});
 else if(d.topPlay.confidence==="BAJA")gaps.push({weight:18,title:"PLAYBOOK CON CONFIANZA BAJA",detail:`Solo ${d.topPlay.count} caso(s) sostienen la mejor ruta.`,action:"Acumular más casos antes de generalizar."});
 if(!d.topLesson)gaps.push({weight:25,title:"SIN LECCIÓN APLICABLE",detail:"La memoria aún no produjo una lección útil para este contexto.",action:"Continuar revisión de resultados y patrones."});
 else if(d.topLesson.confidence==="BAJA")gaps.push({weight:15,title:"LECCIÓN FRÁGIL",detail:"La lección más relevante descansa en una muestra pequeña.",action:"Tratarla como hipótesis, no como regla."});
 const cal=guardianDecisionCalibration().reduce((n,x)=>n+x.count,0);
 if(cal<5)gaps.push({weight:20,title:"CALIBRACIÓN INMADURA",detail:`Solo ${cal} decisión(es) tienen resultado enlazado.`,action:"Llegar al menos a 5 antes de extraer tendencias fuertes."});
 return gaps.sort((a,b)=>b.weight-a.weight);
}

 for(const l of lessons){

function guardianDecisionLessons(){
 const patterns=guardianDecisionPatterns(),lessons=[];
 const grouped={};
 for(const p of patterns){
  const key=p.choice;
  if(!grouped[key])grouped[key]={choice:key,total:0,review:0,aligned:0,neutral:0,gaps:[]};
  const g=grouped[key];g.total++;g[p.level]=(g[p.level]||0)+1;g.gaps.push(p.gap);
 }
 for(const g of Object.values(grouped)){
  const avgGap=Math.round(g.gaps.reduce((a,b)=>a+b,0)/g.gaps.length);
  let status="OBSERVAR",text="La evidencia todavía es mixta; conviene seguir registrando casos.";
  if(g.total>=3&&g.review/g.total>=.6){status="REVISAR CRITERIO";text="Esta decisión aparece repetidamente por debajo de alternativas históricas disponibles."}
  else if(g.total>=3&&g.aligned/g.total>=.6){status="CRITERIO CONSISTENTE";text="Esta decisión se sostiene repetidamente frente a alternativas históricas disponibles."}
  lessons.push({...g,avgGap,status,text,confidence:g.total>=6?"ALTA":g.total>=3?"MEDIA":"BAJA"});
 }
 return lessons.sort((a,b)=>b.total-a.total);
}

function guardianDecisionPatterns(){

  else if(gap<=-15)patterns.push({level:"aligned",choice:x.choice,alt:x.alternative.choice,gap,title:"DECISIÓN COMPETITIVA",detail:`El resultado observado supera por ${Math.abs(gap)} puntos a la mejor alternativa histórica disponible.`});
  else patterns.push({level:"neutral",choice:x.choice,alt:x.alternative.choice,gap,title:"SIN VENTAJA CLARA",detail:"La evidencia disponible no muestra una diferencia amplia entre rutas."});
 }
 return patterns;
}

function decisionOutcomeLinks(){

 });

function decisionWisdom(){

function guardianPlaybookMatch(){

}

function responseEffectiveness(run){
 if(!run)return {score:0,label:"SIN DATOS",delta:0};
 const delta=Number(run.after.avg||0)-Number(run.before.avg||0);
 const riskGain=Number(run.before.critical||0)-Number(run.after.critical||0);
 const incidentGain=Number(run.before.open||0)-Number(run.after.open||0);
 const penalty=(run.errors||[]).length*10;
 let score=50+(delta*3)+(riskGain*12)+(incidentGain*6)-penalty;
 score=Math.max(0,Math.min(100,Math.round(score)));
 const label=score>=80?"RESPUESTA EFECTIVA":score>=55?"MEJORA PARCIAL":score>=35?"SIN CAMBIO SUFICIENTE":"RESPUESTA INEFECTIVA";
 return {score,label,delta,riskGain,incidentGain};
}

function guardianEarlyWarnings(){

 const recent=h[0],prev=h[1];
 if(recent.avg<prev.avg&&a.status!=="progressive")warnings.push({level:"watch",title:"PRIMERA CAÍDA DETECTADA",detail:`El score bajó ${prev.avg-recent.avg} punto(s) desde la lectura anterior.`});
 if(recent.critical>prev.critical)warnings.push({level:"high",title:"RIESGO EN ASCENSO",detail:`Aumentaron las obras en riesgo: ${prev.critical} → ${recent.critical}.`});
 if(recent.open>prev.open)warnings.push({level:"high",title:"INCIDENTES CRECIENDO",detail:`Los incidentes abiertos subieron ${prev.open} → ${recent.open}.`});
 const op=x=>x.conflicts+x.queue+x.healthBad;
 if(op(recent)>op(prev))warnings.push({level:"watch",title:"PRESIÓN OPERATIVA",detail:`Las señales pendientes aumentaron ${op(prev)} → ${op(recent)}.`});
 if(a.status==="progressive")warnings.unshift({level:"critical",title:"DETERIORO PROGRESIVO CONFIRMADO",detail:(a.signals||[]).join(" · ")});
 if(!warnings.length)warnings.push({level:"ok",title:"SIN ALERTAS TEMPRANAS",detail:"Las últimas lecturas no muestran una escalada detectable."});
 return warnings;
}

function guardianDeteriorationAnalysis(){
 const h=getGuardianHistory().slice(0,12);
 if(h.length<3)return {status:"insufficient",label:"DATOS INSUFICIENTES",drop:0,streak:0,signals:[],points:[...h].reverse()};
 const p=[...h].reverse(),first=p[0],last=p[p.length-1];let streak=0,signals=[];
 for(let i=p.length-1;i>0;i--){if(p[i].avg<p[i-1].avg)streak++;else break}
 const drop=first.avg-last.avg;
 if(streak>=3)signals.push(`${streak} caídas consecutivas`);
 if(drop>=15)signals.push(`pérdida acumulada de ${drop} puntos`);
 const rr=last.critical-first.critical;if(rr>0)signals.push(`+${rr} obra(s) en riesgo`);
 const ir=last.open-first.open;if(ir>0)signals.push(`+${ir} incidente(s) abierto(s)`);
 const op=(last.conflicts+last.queue+last.healthBad)-(first.conflicts+first.queue+first.healthBad);
 if(op>=3)signals.push(`+${op} señales operativas pendientes`);
 const progressive=streak>=3||(drop>=15&&signals.length>=2);
 return {status:progressive?"progressive":drop>0?"watch":"stable",label:progressive?"DETERIORO PROGRESIVO":drop>0?"VIGILAR TENDENCIA":"SIN DETERIORO PROGRESIVO",drop,streak,signals,points:p};
}

function rootCauseTimeline(incident){
 const center=new Date(incident.at).getTime(),windowMs=6*60*60*1000,events=[];
 for(const e of getActivityLogSafe()){
  const t=new Date(e.at||e.createdAt||e.timestamp||0).getTime();
  if(t&&Math.abs(t-center)<=windowMs)events.push({at:new Date(t).toISOString(),type:"activity",title:e.action||e.message||e.type||"Actividad",detail:e.meta?JSON.stringify(e.meta):""});
 }
 const q=getOfflineQueue().filter(x=>(x.projectId||"")===incident.projectId);
 q.forEach(x=>events.push({at:x.createdAt||incident.at,type:"queue",title:"Operación en cola",detail:x.action||x.type||"Pendiente"}));
 const cf=getConflictQueue().filter(x=>(x.projectId||"")===incident.projectId);
 cf.forEach(x=>events.push({at:x.createdAt||incident.at,type:"conflict",title:"Conflicto detectado",detail:x.type||x.id||""}));
 const health=JSON.parse(localStorage.getItem("rapsanar_health_results")||'{"at":null,"results":[]}');
 if(health.at&&Math.abs(new Date(health.at).getTime()-center)<=windowMs){
  health.results.filter(x=>x.status!=="ok").forEach(x=>events.push({at:health.at,type:"health",title:`Health: ${x.name}`,detail:x.detail||x.status}));
 }
 events.push({at:incident.at,type:"incident",title:`Caída ${incident.from} → ${incident.to}`,detail:(incident.reasons||[]).join(" · ")});
 return events.sort((a,b)=>new Date(a.at)-new Date(b.at));
}
function inferRootCauses(incident,timeline){
 const causes=[];
 if(timeline.some(x=>x.type==="conflict"))causes.push({confidence:"ALTA",title:"Conflictos pendientes",detail:"Hay conflictos del proyecto alrededor del incidente."});
 if(timeline.some(x=>x.type==="queue"))causes.push({confidence:"MEDIA",title:"Operaciones sin sincronizar",detail:"La cola offline contiene operaciones asociadas al proyecto."});
 if(timeline.some(x=>x.type==="health"))causes.push({confidence:"MEDIA",title:"Señal de infraestructura",detail:"Health Center registró advertencias o fallos cerca de la caída."});
 if((incident.reasons||[]).some(x=>/respaldo|backup/i.test(x)))causes.push({confidence:"ALTA",title:"Cobertura de backup",detail:"El propio Safety Score atribuyó parte de la caída al respaldo."});
 if(!causes.length)causes.push({confidence:"BAJA",title:"Causa no determinada",detail:"No hay evidencia suficiente en las señales locales disponibles."});
 return causes;
}

 if(p.status==="risk")actions.push({impact:35,key:"backup",title:"CREAR BACKUP",detail:"El proyecto no tiene un respaldo confiable reciente.",go:"renderBackupVaultV5()"});
 else if(p.status==="warn")actions.push({impact:18,key:"backup",title:"ACTUALIZAR BACKUP",detail:"El respaldo ya superó el umbral configurado.",go:"renderBackupVaultV5()"});
 if(cf)actions.push({impact:Math.min(20,cf*5),key:"conflict",title:"RESOLVER CONFLICTOS",detail:`${cf} conflicto(s) están reduciendo protección.`,go:"renderConflictCenter()"});
 if(q)actions.push({impact:Math.min(15,q*3),key:"queue",title:"VACIAR COLA",detail:`${q} operación(es) siguen pendientes.`,go:"renderOfflineQueue()"});
 if(health.some(x=>["backend","rls","cloud"].includes(x.key)&&x.status==="bad"))actions.push({impact:10,key:"cloud",title:"REVISAR NUBE",detail:"Health Center detectó una falla Cloud/RLS.",go:"renderHealthCenter()"});

}

function projectSafetyScores(){
 const coverage=projectBackupCoverage(),q=getOfflineQueue(),cf=getConflictQueue(),health=JSON.parse(localStorage.getItem("rapsanar_health_results")||'{"results":[]}').results||[];
 const cloudBad=health.some(x=>["backend","rls","cloud"].includes(x.key)&&x.status==="bad");
 const integrityBad=health.some(x=>x.status==="bad"&&["indexeddb","pwa"].includes(x.key));
 return coverage.map(p=>{
  let score=100,reasons=[];
  if(p.status==="risk"){score-=35;reasons.push("Sin respaldo confiable reciente");}
  else if(p.status==="warn"){score-=18;reasons.push("Respaldo pendiente");}
  const pq=q.filter(x=>(x.projectId||"")===p.id).length;if(pq){score-=Math.min(15,pq*3);reasons.push(`${pq} operación(es) en cola`);}
  const pc=cf.filter(x=>(x.projectId||"")===p.id).length;if(pc){score-=Math.min(20,pc*5);reasons.push(`${pc} conflicto(s) pendiente(s)`);}
  if(cloudBad){score-=10;reasons.push("Infraestructura cloud con fallo");}
  if(integrityBad){score-=15;reasons.push("Componente local crítico con fallo");}
  score=Math.max(0,Math.min(100,score));
  const level=score>=90?"safe":score>=70?"good":score>=45?"warn":"risk";
  return {...p,score,level,reasons};
 });
}

function projectBackupCoverage(){
 const projects=vaultProjectCandidates().filter(x=>x.id!=="all"),cat=getVaultCatalog(),schedule=getBackupSchedule(),now=Date.now();

  const items=cat.filter(x=>x.projectId===p.id).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)),last=items[0]||null;

function retentionAnalysis(){

function strictChainReport(items){
 const full=items.filter(x=>x.manifest.schema==="RAPSANAR_BACKUP_VAULT_ZIP");
 const inc=items.filter(x=>x.manifest.schema==="RAPSANAR_BACKUP_INCREMENTAL");
 const issues=[];
 if(full.length!==1)issues.push(`Se esperaba 1 base completa y hay ${full.length}.`);
 if(!full.length)return {ok:false,issues,ordered:[]};
 const base=full[0],ordered=[base],byBase={};
 for(const x of inc){
  const b=x.manifest.baseId||"__none__";(byBase[b]??=[]).push(x);
 }
 let current=base.manifest.backupId||null,seen=new Set(),guard=0;
 while(guard++<100){
  const nexts=byBase[current||"__none__"]||[];
  if(nexts.length>1){issues.push(`Rama detectada después de ${current||"BASE"}: ${nexts.length} incrementales.`);break}
  if(!nexts.length)break;
  const n=nexts[0];
  if(seen.has(n.manifest.backupId)){issues.push("Ciclo detectado en la cadena.");break}
  seen.add(n.manifest.backupId);ordered.push(n);current=n.manifest.backupId;
 }
 const unused=inc.filter(x=>!ordered.includes(x));
 if(unused.length)issues.push(`${unused.length} incremental(es) no conectan con la cadena principal.`);
 for(let i=1;i<ordered.length;i++){
  const prev=ordered[i-1],cur=ordered[i];
  if(cur.manifest.baseId && prev.manifest.backupId && cur.manifest.baseId!==prev.manifest.backupId)
   issues.push(`Hueco entre ${prev.file.name} y ${cur.file.name}.`);
 }
 return {ok:issues.length===0,issues,ordered};
}

function orderChain(items){
 const full=items.filter(x=>x.manifest.schema==="RAPSANAR_BACKUP_VAULT_ZIP");
 const inc=items.filter(x=>x.manifest.schema==="RAPSANAR_BACKUP_INCREMENTAL");
 if(!full.length)throw new Error("La cadena necesita al menos un Vault ZIP completo como base.");

 const ordered=[base],remaining=[...inc];
 let currentId=base.manifest.backupId||null,guard=0;

  if(idx<0)break;
  const next=remaining.splice(idx,1)[0];ordered.push(next);currentId=next.manifest.backupId||currentId;

}

function backoffDelay(tries){
 return Math.min(60000,1000*Math.pow(2,Math.max(0,tries)));
}
async function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function retryWithBackoff(fn,tries=0){
 try{return await fn()}
 catch(e){
  if(tries>=4)throw e;
  const wait=backoffDelay(tries);
  await sleep(wait);
  return retryWithBackoff(fn,tries+1);
 }
}

async function requestBackgroundSync(){
 if(!("serviceWorker" in navigator))return false;
 try{
  const reg=await navigator.serviceWorker.ready;
  if("sync" in reg){
   await reg.sync.register("rapsanar-sync");
   return true;
  }
 }catch(e){}
 return false;
}
async function notifyQueueChanged(){
 updateNetBadge();
 if(getOfflineQueue().length) await requestBackgroundSync();
}

function getOfflineQueue(){return JSON.parse(localStorage.getItem("rapsanar_offline_queue")||"[]")}
function saveOfflineQueue(q){localStorage.setItem("rapsanar_offline_queue",JSON.stringify(q));notifyQueueChanged()}
function queueOperation(op){
 const q=getOfflineQueue();
 q.push({id:String(Date.now())+Math.random().toString(16).slice(2),createdAt:new Date().toISOString(),tries:0,...op});
 saveOfflineQueue(q);logActivity("queue","Operación agregada a cola offline",{kind:op.kind,projectId:op.projectId||null});
}
function updateNetBadge(){
 const el=document.getElementById("netBadge");if(!el)return;
 const q=getOfflineQueue();el.className=navigator.onLine?"netBadge online":"netBadge offline";
 el.textContent=(navigator.onLine?"● ONLINE":"● OFFLINE")+" · "+q.length+" pendientes";
}
async function runQueuedOperation(op){
 if(op.kind==="syncAudio")return await smartSyncAudio(op.projectId,true);
 if(op.kind==="pushProject")return await pushCurrentProjectToCloud(true,op.projectName);
 throw new Error("Operación desconocida");
}
async function retryOfflineQueue(force=false){
 if(!navigator.onLine){updateNetBadge();return}
 if(!force){const gate=await canAutoSync();if(!gate.ok){updateNetBadge();return}}
 const q=getOfflineQueue(),remaining=[],now=Date.now();
 for(const op of q){
  if(op.nextRetryAt && op.nextRetryAt>now){remaining.push(op);continue}
  try{
   op.status="running";
   await runQueuedOperation(op);
  }catch(e){
   op.tries=(op.tries||0)+1;
   op.lastError=e.message;
   op.status="waiting";
   op.nextRetryAt=Date.now()+backoffDelay(op.tries);
   remaining.push(op);
  }
 }
 saveOfflineQueue(remaining);
 if(document.getElementById("queueList"))renderOfflineQueue();
}
function cancelQueuedOperation(id){saveOfflineQueue(getOfflineQueue().filter(x=>x.id!==id));renderOfflineQueue()}

function getConflictQueue(){return JSON.parse(localStorage.getItem("rapsanar_conflicts")||"[]")}
function saveConflictQueue(q){localStorage.setItem("rapsanar_conflicts",JSON.stringify(q))}
function addConflict(c){
 const q=getConflictQueue(),i=q.findIndex(x=>x.projectId===c.projectId&&x.takeId===c.takeId);
 if(i>=0)q[i]=c;else q.push(c);saveConflictQueue(q);
}
async function fetchRemoteBlob(projectId,takeId,type){
 const s=getAuthSession(),u=s?.user,ext=(type||"audio/webm").includes("wav")?"wav":"webm";
 const path=`${u.id}/${projectId}/${safePathPart(takeId)}.${ext}`;
 const r=await storageRequest("object/rapsanar-audio/"+path);return await r.blob();
}
async function resolveConflict(projectId,takeId,choice){
 const q=getConflictQueue(),c=q.find(x=>x.projectId===projectId&&x.takeId===takeId);if(!c)return;
 try{
  if(choice==="local"){
   const blob=await loadAudio(takeId),s=getAuthSession(),ext=c.type.includes("wav")?"wav":"webm",path=`${s.user.id}/${projectId}/${safePathPart(takeId)}.${ext}`;
   await storageRequest("object/rapsanar-audio/"+path,{method:"POST",body:blob,contentType:c.type});
  }else if(choice==="cloud"){
   const blob=await fetchRemoteBlob(projectId,takeId,c.type);await storeAudio(takeId,blob);
  }else if(choice==="both"){
   const remote=await fetchRemoteBlob(projectId,takeId,c.type),copyId=takeId+"_cloud_"+Date.now();
   await storeAudio(copyId,remote);
   const takes=getTakes(),base=takes.find(x=>x.id===takeId);
   if(base){takes.push({...base,id:copyId,name:(base.name||takeId)+" · nube"});localStorage.setItem("rapsanar_takes",JSON.stringify(takes))}
  }
  saveConflictQueue(q.filter(x=>!(x.projectId===projectId&&x.takeId===takeId)));
  logActivity("conflict","Conflicto resuelto",{projectId,takeId,choice});alert("Conflicto resuelto.");renderConflictCenter(projectId);
 }catch(e){alert("Resolver conflicto: "+e.message)}
}

function getSyncManifest(){return JSON.parse(localStorage.getItem("rapsanar_sync_manifest")||"{}")}
function saveSyncManifest(v){localStorage.setItem("rapsanar_sync_manifest",JSON.stringify(v))}
async function localAudioManifest(projectId){
 const takes=getTakes(),items=[];
 for(const t of takes){
  const blob=await loadAudio(t.id);if(!blob)continue;
  const bytes=new Uint8Array(await blob.arrayBuffer());
  items.push({id:t.id,hash:await sha256Bytes(bytes),bytes:bytes.length,type:blob.type||"audio/webm"});
 }
 return {projectId,updatedAt:new Date().toISOString(),items};
}
async function smartSyncAudio(projectId,fromQueue=false){
 const audit=startAudit("sync","Smart Sync",{projectId});
 const s=getAuthSession(),u=s?.user;if(!u?.id)return alert("Sesión inválida.");
 if(!navigator.onLine){
  if(!fromQueue){queueOperation({kind:"syncAudio",projectId});alert("Sin internet: Sync Audio quedó en cola.");}
  throw new Error("Offline");
 }
 try{
  const local=await localAudioManifest(projectId),remoteFiles=await listProjectAudio(projectId),saved=getSyncManifest()[projectId]||{items:[]};
  const savedMap=Object.fromEntries((saved.items||[]).map(x=>[x.id,x]));
  const remoteNames=new Set((remoteFiles||[]).map(x=>x.name));
  let uploaded=0,skipped=0,conflicts=0,errors=0;
  setSyncProgress({active:true,done:0,total:local.items.length,label:"Smart Sync",current:"Preparando…",errors:0});
  let doneCount=0;
  for(const item of local.items){
   const prev=savedMap[item.id],ext=item.type.includes("wav")?"wav":"webm",name=`${safePathPart(item.id)}.${ext}`;
   if(prev&&prev.hash===item.hash&&remoteNames.has(name)){skipped++;doneCount++;setSyncProgress({active:true,done:doneCount,total:local.items.length,label:"Smart Sync",current:"Sin cambios: "+item.id,errors});continue}
   if(prev&&prev.hash!==item.hash&&remoteNames.has(name)){
    conflicts++;let remoteHash="unknown";
    try{const rb=await fetchRemoteBlob(projectId,item.id,item.type);remoteHash=await sha256Bytes(new Uint8Array(await rb.arrayBuffer()))}catch(e){}
    addConflict({projectId,takeId:item.id,name:(getTakes().find(t=>t.id===item.id)?.name||item.id),type:item.type,localHash:item.hash,remoteHash,detectedAt:new Date().toISOString()});
    doneCount++;setSyncProgress({active:true,done:doneCount,total:local.items.length,label:"Smart Sync",current:"Conflicto: "+item.id,errors});continue;
   }
   const blob=await loadAudio(item.id),path=`${u.id}/${projectId}/${name}`;
   try{
    setSyncProgress({active:true,done:doneCount,total:local.items.length,label:"Smart Sync",current:"Subiendo: "+item.id,errors});
    await retryWithBackoff(()=>storageRequest("object/rapsanar-audio/"+path,{method:"POST",body:blob,contentType:item.type}));
    uploaded++;
   }catch(e){errors++;}
   doneCount++;setSyncProgress({active:true,done:doneCount,total:local.items.length,label:"Smart Sync",current:"Procesado: "+item.id,errors});
  }
  const all=getSyncManifest();all[projectId]=local;saveSyncManifest(all);
  setSyncProgress({active:false,done:local.items.length,total:local.items.length,label:"Smart Sync completado",current:"Listo",errors});
  const transferredBytes=local.items.reduce((sum,x)=>sum+(x.bytes||0),0);
  finishAudit(audit,errors?"partial":"ok",{projectId,uploaded,skipped,conflicts,errors,bytes:transferredBytes});
  logActivity("sync","Smart Sync terminado",{projectId,uploaded,skipped,conflicts,errors,bytes:transferredBytes});alert(`Sync inteligente · ${uploaded} subidos · ${skipped} sin cambios${conflicts?` · ${conflicts} conflictos enviados al Centro de Conflictos`:""}${errors?` · ${errors} errores`:""}.`);
  await renderSyncStatus(projectId);
 }catch(e){alert("Sync inteligente: "+e.message)}
}
async function renderSyncStatus(projectId){
 try{
  const local=await localAudioManifest(projectId),remote=await listProjectAudio(projectId),saved=getSyncManifest()[projectId]||{items:[]};
  const savedMap=Object.fromEntries((saved.items||[]).map(x=>[x.id,x])),remoteNames=new Set((remote||[]).map(x=>x.name));
  let localOnly=0,synced=0,changed=0;
  for(const i of local.items){
   const ext=i.type.includes("wav")?"wav":"webm",exists=remoteNames.has(`${safePathPart(i.id)}.${ext}`),prev=savedMap[i.id];
   if(!exists)localOnly++; else if(prev&&prev.hash===i.hash)synced++; else changed++;
  }
  const el=document.getElementById("syncStatus-"+projectId);
  if(el)el.innerHTML=`<b>${synced} SINCRONIZADO</b><span>${localOnly} LOCAL · ${changed} CAMBIADO · ${remoteNames.size} EN NUBE</span>`;
 }catch(e){}
}

function safePathPart(v){return String(v||"item").replace(/[^a-zA-Z0-9._-]/g,"_")}
async function storageRequest(path,{method="GET",body=null,contentType=null}={}){
 const c=getCloudConfig(),s=getAuthSession();
 if(!c.url||!c.anonKey)throw new Error("Configura RAPSANAR Cloud.");
 if(!s?.access_token)throw new Error("Inicia sesión.");
 const headers={apikey:c.anonKey,Authorization:"Bearer "+s.access_token};
 if(contentType)headers["Content-Type"]=contentType;
 const r=await fetch(c.url+"/storage/v1/"+path,{method,headers,body});
 if(!r.ok){const t=await r.text();throw new Error(t||("HTTP "+r.status))}
 return r;
}

async function uploadProjectAudio(projectId){
 const s=getAuthSession(),u=s?.user;if(!u?.id)return alert("Sesión inválida.");
 const takes=getTakes();if(!takes.length)return alert("No hay tomas locales para subir.");
 let ok=0,failed=0;
 for(const t of takes){
  try{
   const blob=await loadAudio(t.id);if(!blob)continue;
   const ext=(blob.type||"audio/webm").includes("wav")?"wav":"webm";
   const path=`${u.id}/${projectId}/${safePathPart(t.id)}.${ext}`;
   await storageRequest("object/rapsanar-audio/"+path,{method:"POST",body:blob,contentType:blob.type||"application/octet-stream"});
   ok++;
  }catch(e){failed++}
 }
 logActivity("sync","Carga de audio terminada",{projectId,ok,failed});alert(`Audio nube: ${ok} subidos${failed?` · ${failed} fallaron`:""}.`);

 const prefix=`${u.id}/${projectId}`;

async function downloadProjectAudio(projectId){
 const s=getAuthSession(),u=s?.user;if(!u?.id)return alert("Sesión inválida.");
 try{
  const files=await listProjectAudio(projectId);let ok=0;
  for(const f of files||[]){
   if(!f.name)continue;
   const path=`${u.id}/${projectId}/${f.name}`;
   const r=await storageRequest("object/rapsanar-audio/"+path);
   const blob=await r.blob();
   const id=f.name.replace(/\.(webm|wav|mp3|ogg|m4a)$/i,"");
   await storeAudio(id,blob);ok++;
  }
  logActivity("restore","Audio restaurado desde nube",{projectId,ok});alert(`Restauración de audio: ${ok} archivos descargados a este dispositivo.`);
 }catch(e){alert("Descargar audio: "+e.message)}
}

async function restRequest(path,{method="GET",body=null,headers={}}={}){
 const c=getCloudConfig(),s=getAuthSession();
 if(!c.url||!c.anonKey)throw new Error("Configura RAPSANAR Cloud primero.");
 if(!s?.access_token)throw new Error("Inicia sesión para sincronizar.");
 const h={apikey:c.anonKey,Authorization:"Bearer "+s.access_token,...headers};
 if(body!==null)h["Content-Type"]="application/json";
 const r=await fetch(c.url+"/rest/v1/"+path,{method,headers:h,body:body!==null?JSON.stringify(body):undefined});
 const text=await r.text();let data=null;try{data=text?JSON.parse(text):null}catch{data=text}
 if(!r.ok)throw new Error((data&&data.message)||text||("HTTP "+r.status));
 return data;
}

  const rows=await restRequest("projects?select=id,name&name=eq."+encodeURIComponent(name),{headers:{Prefer:"return=representation"}});

   val===null?localStorage.removeItem(key):localStorage.setItem(key,val);

async function supaAuth(path,body){
 const c=getCloudConfig();if(!c.url||!c.anonKey)throw new Error("Primero configura RAPSANAR Cloud.");
 const r=await fetch(c.url+"/auth/v1/"+path,{method:"POST",headers:{"Content-Type":"application/json",apikey:c.anonKey,Authorization:"Bearer "+c.anonKey},body:JSON.stringify(body)});
 const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.msg||data.message||data.error_description||("HTTP "+r.status));return data;
}
async function registerArtist(){
 const email=(document.getElementById("authEmail")?.value||"").trim(),password=document.getElementById("authPassword")?.value||"",artist=(document.getElementById("artistName")?.value||"").trim();
 if(!email||password.length<6)return alert("Email y contraseña de mínimo 6 caracteres.");
 try{const d=await supaAuth("signup",{email,password,data:{artist_name:artist||"Artista RAPSANAR"}});if(d.access_token)saveAuthSession(d);alert(d.access_token?"Cuenta creada y sesión iniciada.":"Cuenta creada. Revisa tu correo si el backend exige confirmación.");renderCloud()}catch(e){alert("Registro: "+e.message)}
}
async function loginArtist(){
 const email=(document.getElementById("authEmail")?.value||"").trim(),password=document.getElementById("authPassword")?.value||"";
 try{const d=await supaAuth("token?grant_type=password",{email,password});saveAuthSession(d);logActivity("auth","Inicio de sesión",{email});alert("Bienvenido a RAPSANAR.");renderCloud()}catch(e){alert("Inicio de sesión: "+e.message)}
}
async function logoutArtist(){
 const c=getCloudConfig(),s=getAuthSession();
 try{if(c.url&&c.anonKey&&s?.access_token)await fetch(c.url+"/auth/v1/logout",{method:"POST",headers:{apikey:c.anonKey,Authorization:"Bearer "+s.access_token}})}catch(e){}

function cloudSchema(){
 return `-- RAPSANAR CLOUD V1
create table if not exists projects (
 id uuid primary key default gen_random_uuid(),
 owner_id uuid not null references auth.users(id) on delete cascade,
 name text not null,
 snapshot jsonb not null default '{}'::jsonb,
 created_at timestamptz default now(),
 updated_at timestamptz default now()
);
alter table projects enable row level security;
create policy "owners read projects" on projects for select using (auth.uid() = owner_id);
create policy "owners insert projects" on projects for insert with check (auth.uid() = owner_id);
create policy "owners update projects" on projects for update using (auth.uid() = owner_id);
create policy "owners delete projects" on projects for delete using (auth.uid() = owner_id);

create table if not exists project_versions (
 id uuid primary key default gen_random_uuid(),
 project_id uuid not null references projects(id) on delete cascade,
 owner_id uuid not null references auth.users(id) on delete cascade,
 name text not null,
 snapshot jsonb not null,
 created_at timestamptz default now()
);
alter table project_versions enable row level security;
create policy "owners manage versions" on project_versions for all using (auth.uid() = owner_id) with check (auth.uid() = owner_id);

insert into storage.buckets (id,name,public) values ('rapsanar-audio','rapsanar-audio',false) on conflict (id) do nothing;
create policy "owners read audio" on storage.objects for select using (bucket_id='rapsanar-audio' and (storage.foldername(name))[1]=auth.uid()::text);
create policy "owners upload audio" on storage.objects for insert with check (bucket_id='rapsanar-audio' and (storage.foldername(name))[1]=auth.uid()::text);
create policy "owners update audio" on storage.objects for update using (bucket_id='rapsanar-audio' and (storage.foldername(name))[1]=auth.uid()::text);
create policy "owners delete audio" on storage.objects for delete using (bucket_id='rapsanar-audio' and (storage.foldername(name))[1]=auth.uid()::text);`;
}
function downloadCloudSchema(){
 const b=new Blob([cloudSchema()],{type:"text/sql"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="RAPSANAR_CLOUD_V1_SUPABASE.sql";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);

const HISTORY_KEYS=["rapsanar_edits","rapsanar_automation","rapsanar_master_auto","rapsanar_markers","rapsanar_mix","rapsanar_master","rapsanar_loop","rapsanar_musical_grid"];
let historyStack=[],redoStack=[],historyLock=false;
function snapshotState(){
 const s={};HISTORY_KEYS.forEach(k=>s[k]=localStorage.getItem(k));return JSON.stringify(s);
}
function pushHistory(){
 if(historyLock)return;
 const snap=snapshotState();
 if(historyStack[historyStack.length-1]!==snap){historyStack.push(snap);if(historyStack.length>60)historyStack.shift();redoStack=[]}
 updateHistoryUI();
}
function restoreSnapshot(raw){
 if(!raw)return;historyLock=true;const s=JSON.parse(raw);
 HISTORY_KEYS.forEach(k=>s[k]===null?localStorage.removeItem(k):localStorage.setItem(k,s[k]));
 historyLock=false;renderTimeline();
}
function undoEdit(){
 if(!historyStack.length)return;
 redoStack.push(snapshotState());restoreSnapshot(historyStack.pop());
}
function redoEdit(){
 if(!redoStack.length)return;
 historyStack.push(snapshotState());restoreSnapshot(redoStack.pop());
}
function updateHistoryUI(){
 const u=document.getElementById("undoCount"),r=document.getElementById("redoCount");
 if(u)u.textContent=historyStack.length;if(r)r.textContent=redoStack.length;
}
function deleteAutoPoint(id,param,index,ev){
 ev?.stopPropagation();pushHistory();const a=getAutomation();if(a[id]?.[param])a[id][param].splice(index,1);
 localStorage.setItem("rapsanar_automation",JSON.stringify(a));renderTimeline();
}
function autoCurveSvg(points,param){
 const d=timelineDuration(),range=autoRange(param),sorted=[...(points||[])].sort((a,b)=>a.time-b.time);
 if(!sorted.length)return "";
 const pts=sorted.map(p=>`${(p.time/d)*100},${((range.max-p.value)/(range.max-range.min))*44}`).join(" ");
 return `<svg class="autoCurve" viewBox="0 0 100 44" preserveAspectRatio="none"><polyline points="${pts}"/></svg>`;
}

let autoDrag=null;
function autoRange(param){return param==="gain"?{min:0,max:1.5}:{min:-1,max:1}}
function addAutoFromLane(ev,id,param){
 if(ev.target.classList.contains("autoPoint"))return;
 pushHistory();const r=ev.currentTarget.getBoundingClientRect(),time=((ev.clientX-r.left)/r.width)*timelineDuration(),range=autoRange(param);
 const value=range.max-((ev.clientY-r.top)/r.height)*(range.max-range.min);
 const a=getAutomation();a[id]=a[id]||{gain:[],pan:[]};a[id][param].push({id:String(Date.now()),time:Math.max(0,time),value:Math.max(range.min,Math.min(range.max,value))});a[id][param].sort((x,y)=>x.time-y);localStorage.setItem("rapsanar_automation",JSON.stringify(a));renderTimeline();
}
function beginAutoDrag(ev,id,param,index){
 ev.stopPropagation();pushHistory();autoDrag={id,param,index,lane:ev.currentTarget.parentElement.getBoundingClientRect()};ev.currentTarget.setPointerCapture?.(ev.pointerId);
}
function moveAutoDrag(ev){
 if(!autoDrag)return;const a=getAutomation(),pts=a[autoDrag.id]?.[autoDrag.param];if(!pts||!pts[autoDrag.index])return;
 const r=autoDrag.lane,range=autoRange(autoDrag.param),time=Math.max(0,Math.min(timelineDuration(),((ev.clientX-r.left)/r.width)*timelineDuration())),value=range.max-((ev.clientY-r.top)/r.height)*(range.max-range.min);
 pts[autoDrag.index].time=time;pts[autoDrag.index].value=Math.max(range.min,Math.min(range.max,value));localStorage.setItem("rapsanar_automation",JSON.stringify(a));
 ev.currentTarget.style.left=(time/timelineDuration()*100)+"%";ev.currentTarget.style.top=((range.max-pts[autoDrag.index].value)/(range.max-range.min)*100)+"%";
}
function endAutoDrag(){if(!autoDrag)return;autoDrag=null;renderTimeline()}
function getMasterAutomation(){return JSON.parse(localStorage.getItem("rapsanar_master_auto")||'{"gain":[]}')}
function addMasterAuto(){
 pushHistory();const a=getMasterAutomation(),time=timelineState.scrub||0,value=getMaster().gain;a.gain.push({time,value});a.gain.sort((x,y)=>x.time-y);localStorage.setItem("rapsanar_master_auto",JSON.stringify(a));renderTimeline();
}
function clearMasterAuto(){pushHistory();localStorage.setItem("rapsanar_master_auto",'{"gain":[]}');renderTimeline()}

function scheduleAutomation(param,points,base,ctxStart,timelineFrom,clipOffset,clipEnd){
 const sorted=[...(points||[])].sort((a,b)=>a.time-b.time);
 param.cancelScheduledValues(ctxStart);
 let prev=base;
 for(const p of sorted) if(p.time<=timelineFrom) prev=p.value;
 param.setValueAtTime(prev,ctxStart);
 for(const p of sorted){
  if(p.time<=timelineFrom || p.time>clipEnd) continue;
  const when=ctxStart+(p.time-timelineFrom);
  param.linearRampToValueAtTime(p.value,when);
 }
}
function automationValueAt(points,time,base){
 const s=[...(points||[])].sort((a,b)=>a.time-b.time);
 if(!s.length)return base;
 if(time<=s[0].time)return base;
 let prev={time:0,value:base};
 for(const p of s){
  if(time===p.time)return p.value;
  if(time<p.time){
   const span=p.time-prev.time||1,f=(time-prev.time)/span;
   return prev.value+(p.value-prev.value)*Math.max(0,Math.min(1,f));
  }
  prev=p;
 }
 return prev.value;
}

let trimDrag=null,metronomeTimer=null,metroCtx=null;
function beginTrim(ev,id,edge){
 ev.stopPropagation();pushHistory();const w=waveformData[id],e=getEdits();if(!w)return;
 const cur=e[id]||{trimStart:0,trimEnd:w.duration,offset:0};
 trimDrag={id,edge,startX:ev.clientX,width:ev.currentTarget.parentElement.getBoundingClientRect().width,duration:w.duration,start:Number(edge==="left"?cur.trimStart:(cur.trimEnd==null?w.duration:cur.trimEnd))};
 ev.currentTarget.setPointerCapture?.(ev.pointerId);
}
function moveTrim(ev){
 if(!trimDrag)return;const delta=(ev.clientX-trimDrag.startX)/trimDrag.width*trimDrag.duration,e=getEdits(),w=waveformData[trimDrag.id];
 e[trimDrag.id]=e[trimDrag.id]||{trimStart:0,trimEnd:w.duration,offset:0};
 if(trimDrag.edge==="left")e[trimDrag.id].trimStart=Math.max(0,Math.min(trimDrag.start+delta,(e[trimDrag.id].trimEnd??w.duration)-.01));
 else e[trimDrag.id].trimEnd=Math.min(w.duration,Math.max(trimDrag.start+delta,(e[trimDrag.id].trimStart||0)+.01));
 localStorage.setItem("rapsanar_edits",JSON.stringify(e));
}
function endTrim(){if(!trimDrag)return;trimDrag=null;renderTimeline()}
function getLoop(){return JSON.parse(localStorage.getItem("rapsanar_loop")||'{"enabled":false,"start":0,"end":4}')}
function setLoopPoint(key){pushHistory();const l=getLoop();l[key]=timelineState.scrub||0;if(l.end<=l.start)l.end=l.start+secondsPerBeat();localStorage.setItem("rapsanar_loop",JSON.stringify(l));renderTimeline()}
function toggleLoop(){pushHistory();const l=getLoop();l.enabled=!l.enabled;localStorage.setItem("rapsanar_loop",JSON.stringify(l));renderTimeline()}
function toggleMetronome(){
 if(metronomeTimer){clearInterval(metronomeTimer);metronomeTimer=null;if(metroCtx)metroCtx.close();metroCtx=null;renderTimeline();return}
 metroCtx=new (window.AudioContext||window.webkitAudioContext)();
 const click=()=>{const o=metroCtx.createOscillator(),g=metroCtx.createGain();o.frequency.value=1000;g.gain.setValueAtTime(.12,metroCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,metroCtx.currentTime+.05);o.connect(g).connect(metroCtx.destination);o.start();o.stop(metroCtx.currentTime+.06)};
 click();metronomeTimer=setInterval(click,secondsPerBeat()*1000);renderTimeline();
}

function getMusicalGrid(){return JSON.parse(localStorage.getItem("rapsanar_musical_grid")||'{"bpm":90,"beats":4,"division":1}')}
function setMusicalGrid(key,value){pushHistory();const g=getMusicalGrid();g[key]=Number(value);localStorage.setItem("rapsanar_musical_grid",JSON.stringify(g));renderTimeline()}
function secondsPerBeat(){return 60/getMusicalGrid().bpm}
function musicalSnap(sec){
 const g=getMusicalGrid(),step=secondsPerBeat()/Math.max(1,g.division);
 return Math.round(sec/step)*step;
}
function formatMusical(sec){
 const g=getMusicalGrid(),beatFloat=sec/secondsPerBeat(),bar=Math.floor(beatFloat/g.beats)+1,beat=Math.floor(beatFloat%g.beats)+1;
 return `${bar}.${beat}`;
}

let dragClipState=null;
function getGrid(){return Number(localStorage.getItem("rapsanar_grid")||0.25)}
function setGrid(v){localStorage.setItem("rapsanar_grid",String(v));renderTimeline()}
function snapTime(sec){const mg=getMusicalGrid();if(mg.division>0)return musicalSnap(sec);const g=getGrid();return g>0?Math.round(sec/g)*g:sec}
function beginClipDrag(ev,id){
 ev.stopPropagation();pushHistory();
 const edits=getEdits(),w=waveformData[id];if(!w)return;
 const e=edits[id]||{trimStart:0,trimEnd:w.duration,offset:0};
 dragClipState={id,startX:ev.clientX,startOffset:Number(e.offset||0),width:ev.currentTarget.parentElement.getBoundingClientRect().width,duration:timelineDuration()};
 ev.currentTarget.setPointerCapture?.(ev.pointerId);
}
function moveClipDrag(ev){
 if(!dragClipState)return;
 const deltaSec=(ev.clientX-dragClipState.startX)/dragClipState.width*dragClipState.duration;

const DB_NAME="rapsanar_audio_db",DB_VERSION=1,STORE="takes";
function openAudioDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:"id"})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function storeAudio(id,blob){const db=await openAudioDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).put({id,blob,createdAt:Date.now()});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function loadAudio(id){const db=await openAudioDB();return new Promise((resolve,reject)=>{const r=db.transaction(STORE,"readonly").objectStore(STORE).get(id);r.onsuccess=()=>resolve(r.result?.blob||null);r.onerror=()=>reject(r.error)})}
async function removeAudio(id){const db=await openAudioDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function playTake(id){const blob=await loadAudio(id);if(!blob){alert("Esta toma no tiene audio persistido.");return}const player=document.getElementById("libraryPlayer");player.src=URL.createObjectURL(blob);player.play()}

async function sha256Text(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function getLineageSeals(){return JSON.parse(localStorage.getItem("rapsanar_lineage_seals")||"[]")}
async function sealProofLineage(){
 if(!window.crypto||!crypto.subtle){alert("SHA-256 no disponible en este contexto.");return}
 const p=[...getRecoveryProofs()].reverse(),seals=[];let prev="GENESIS";
 for(const x of p){const payload=JSON.stringify({id:x.id,createdAt:x.createdAt,truthValid:x.truthValid,engine:x.engine,evidenceLinks:x.evidenceLinks,previousSeal:prev});const hash=await sha256Text(payload);seals.push({proofId:x.id,createdAt:x.createdAt,previousSeal:prev,hash});prev=hash}
 localStorage.setItem("rapsanar_lineage_seals",JSON.stringify(seals));renderLineageSeal();
}
async function verifyProofLineage(){

 for(let i=0;i<p.length;i++){const x=p[i],payload=JSON.stringify({id:x.id,createdAt:x.createdAt,truthValid:x.truthValid,engine:x.engine,evidenceLinks:x.evidenceLinks,previousSeal:prev});const hash=await sha256Text(payload),s=stored[i];const row=!!s&&s.proofId===x.id&&s.previousSeal===prev&&s.hash===hash;details.push({id:x.id,ok:row});if(!row)ok=false;prev=hash}
 localStorage.setItem("rapsanar_last_seal_verification",JSON.stringify({at:new Date().toISOString(),ok,details}));renderLineageSeal();
}

function sourceDiversitySignature(id){
 const s=getObservationSources().find(x=>x.id===id);

 return {kind:s.kind||"UNKNOWN",rootCount:roots.length,roots};
}
function diversityForCorroboration(c){
 const a=sourceDiversitySignature(c.sourceId),b=sourceDiversitySignature(c.corroboratingSourceId);

 let score=0;
 if(pair.independent)score+=50;

 if(a.rootCount&&b.rootCount)score+=20;
 if(c.relation==="PARTIAL")score=Math.round(score*.6);
 if(c.relation==="DISAGREE")score=0;
 return {score,label:score>=80?"HIGH DIVERSITY":score>=50?"MODERATE DIVERSITY":score>0?"LOW DIVERSITY":"NO SUPPORT DIVERSITY",shared:pair.shared,kinds:[a.kind,b.kind]};
}

function sourceRoots(id,seen=new Set()){

}

function getSourceCorroborations(){return JSON.parse(localStorage.getItem("rapsanar_source_corroborations")||"[]")}
function registerSourceCorroboration(sourceId){
 const sources=getObservationSources(),primary=sources.find(x=>x.id===sourceId);if(!primary)return;
 const others=sources.filter(x=>x.id!==sourceId&&x.status==="ACTIVE");
 if(!others.length){alert("Necesitas otra fuente ACTIVE independiente.");return}
 const list=others.map((x,i)=>`${i+1}. ${x.name} · ${x.kind} · ${x.trust}`).join("\n");
 const pick=prompt("Selecciona fuente corroborante:\n\n"+list);if(pick===null)return;
 const other=others[parseInt(pick,10)-1];if(!other){alert("Selección inválida.");return}
 const relation=prompt("¿Qué relación observaste? AGREE / DISAGREE / PARTIAL / UNKNOWN","AGREE");if(relation===null)return;
 const detail=prompt("Describe brevemente qué dato/hecho comparaste:","");if(detail===null)return;
 const c=getSourceCorroborations();c.unshift({id:"SC-"+Date.now(),at:new Date().toISOString(),sourceId:primary.id,sourceName:primary.name,corroboratingSourceId:other.id,corroboratingSourceName:other.name,relation:relation.trim().toUpperCase(),detail:detail.trim()});
 localStorage.setItem("rapsanar_source_corroborations",JSON.stringify(c.slice(0,500)));renderSourceCorroborationGate();
}
function corroborationState(sourceId){
 const c=getSourceCorroborations().filter(x=>x.sourceId===sourceId);
 const agree=c.filter(x=>x.relation==="AGREE"),disagree=c.filter(x=>x.relation==="DISAGREE"),partial=c.filter(x=>x.relation==="PARTIAL");
 if(disagree.length)return {state:"CONFLICT",count:c.length};
 if(agree.length>=2)return {state:"MULTI-SOURCE SUPPORT",count:c.length};
 if(agree.length===1||partial.length)return {state:"LIMITED CORROBORATION",count:c.length};
 return {state:"UNCORROBORATED",count:c.length};

function validateLifecycleTransitions(auditId){

   if(i!==0||state!=="NONE")issues.push("AUDITED fuera del inicio");
   state="AUDITED";
  }else if(e.type==="EVIDENCE_BOUND"){
   if(state==="NONE")issues.push("EVIDENCE_BOUND sin AUDITED previo");
  }else if(e.type==="REVOKED"){
   if(state==="NONE")issues.push("REVOKED sin afirmación previa");
   state="REVOKED";
  }else if(e.type==="REINSTATED"){
   if(state!=="REVOKED")issues.push("REINSTATED sin REVOKED previo");
   state="REINSTATED";
  }else if(e.type==="REINSTATEMENT_DENIED"){
   if(state!=="REVOKED")issues.push("DENIED fuera de estado REVOKED");
  }else issues.push("Evento desconocido: "+e.type);
 }
 return {auditId,state,valid:issues.length===0,issues,eventCount:events.length};
}

function assessEvidenceRelevance(z){

 if(c==="RESTORE"&&t==="SNAPSHOT")return {status:"POSSIBLE",reason:"El snapshot demuestra estado histórico, pero por sí solo no prueba que ocurrió una restauración."};

}

function micEnvironment(){
 const protocol=location.protocol||"";
 const secure=window.isSecureContext===true;
 const media=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
 const webReady=protocol==="https:" || (protocol==="http:" && (location.hostname==="localhost"||location.hostname==="127.0.0.1")); return {protocol,secure,media,webReady,ua:navigator.userAgent||""};
}
async function startRecording(){
 const env=micEnvironment();
 if(env.protocol==="content:"||env.protocol==="file:"){
   alert("MIC GATE · ARCHIVO LOCAL\n\nRAPSANAR está funcionando, pero esta copia fue abierta como "+env.protocol+"//. Para grabar de forma confiable en Android, publica V120 bajo HTTPS y abre esa dirección en Chrome.\n\nNo es un fallo del motor.");
   return;
 }
 if(!env.media){
   const msg=env.protocol==="content:"||env.protocol==="file:"
     ?"MICRÓFONO BLOQUEADO POR ORIGEN LOCAL\n\nEsta copia está abierta como "+env.protocol+"// y Android no expone getUserMedia aquí.\n\nLa interfaz funciona, pero para grabar necesitamos abrir RAPSANAR desde HTTPS o una PWA correctamente servida."
     :"MICRÓFONO NO DISPONIBLE\n\nEste navegador/contexto no expone navigator.mediaDevices.getUserMedia.";
   alert(msg); return;
 }
 if(!env.secure){
   alert("CONTEXTO NO SEGURO\n\nEl micrófono requiere un origen seguro. Abre RAPSANAR desde HTTPS antes de grabar."); return;
 }
 try{
  recordingStream=await navigator.mediaDevices.getUserMedia({audio:true});
  recordedChunks=[];mediaRecorder=new MediaRecorder(recordingStream);
  mediaRecorder.ondataavailable=e=>{if(e.data.size)recordedChunks.push(e.data)};
  mediaRecorder.onstop=()=>{
   const blob=new Blob(recordedChunks,{type:mediaRecorder.mimeType||"audio/webm"});
   window.currentTakeBlob=blob;
   document.getElementById("preview").src=URL.createObjectURL(blob);
   recordingStream.getTracks().forEach(t=>t.stop());
   document.getElementById("recState").textContent="TOMA LISTA PARA REVISAR";
   document.getElementById("recDot").classList.remove("live");
  };
  mediaRecorder.start();document.getElementById("recState").textContent="GRABANDO";
  document.getElementById("recDot").classList.add("live");
 }catch(e){
   const name=e&&e.name?e.name:"Error";
   let detail="No fue posible abrir el micrófono.";
   if(name==="NotAllowedError")detail="Permiso denegado o bloqueado por el navegador.";
   else if(name==="NotFoundError")detail="No se encontró un micrófono disponible.";
   else if(name==="NotReadableError")detail="El micrófono existe pero otra app/sistema puede estar usándolo.";
   else if(name==="SecurityError")detail="El navegador bloqueó el micrófono por seguridad del origen.";
   alert("MIC DIAGNOSTIC · "+name+"\n\n"+detail+"\n\nProtocolo: "+location.protocol+"\nSecure context: "+window.isSecureContext);
 }
}
function stopRecording(){if(mediaRecorder&&mediaRecorder.state!=="inactive")mediaRecorder.stop()}
async function saveTake(){
 const name=document.getElementById("takeName").value.trim(),type=document.getElementById("takeType").value,intent=document.getElementById("takeIntent").value.trim();
 if(!name){alert("Ponle nombre a la toma.");return}
 const id=String(Date.now()),blob=window.currentTakeBlob||null;
 if(blob)await storeAudio(id,blob);
 const takes=getTakes();takes.unshift({id,name,type,intent,createdAt:new Date().toLocaleString("es-MX"),favorite:false,hasLocalAudio:!!blob,size:blob?.size||0});
 saveTakes(takes);window.currentTakeBlob=null;renderCabin();
}
function favoriteTake(id){const takes=getTakes().map(t=>({...t,favorite:t.id===id}));saveTakes(takes);renderCabin()}
async function deleteTake(id){await removeAudio(id);saveTakes(getTakes().filter(t=>t.id!==id));renderCabin()}
